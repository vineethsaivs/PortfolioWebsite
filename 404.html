  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')==='light'?'light':'dark'}catch(e){}</script>

    [data-theme="light"] a:hover { color: #ed0612; }
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 1rem;
           padding: 2rem; background: #000000; color: #ffffff; text-align: center; font: 1.05rem/1.7 system-ui, sans-serif; }

  </style>
</head>
