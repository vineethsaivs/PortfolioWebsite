<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Room Sentinel device illustration">
  <rect x="500" y="280" width="600" height="360" rx="28" fill="#16181c" stroke="#2a2a2a" stroke-width="3"/>
  <rect x="540" y="320" width="520" height="200" rx="14" fill="none" stroke="#222" stroke-width="2"/>
  <!-- camera lens with red catchlight -->
  <circle cx="800" cy="420" r="74" fill="none" stroke="#e50914" stroke-width="4"/>
  <circle cx="800" cy="420" r="34" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <circle cx="824" cy="398" r="9" fill="#ff2d3b"/>
  <!-- buzzer -->
  <circle cx="990" cy="570" r="28" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <circle cx="990" cy="570" r="6" fill="#3a3a3a"/>
  <!-- button -->
  <circle cx="610" cy="570" r="26" fill="#1a1a1a" stroke="#e50914" stroke-width="3"/>
